<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Semantic Notes — write naturally, search by meaning." />
    <title>Semantic Notes</title>
    <script>
      // Applies the stored theme before first paint to avoid a flash of the
      // wrong background. React takes over from here.
      ;(function () {
        try {
          var stored = localStorage.getItem('semantic-notes:theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
