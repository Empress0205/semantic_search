name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # sentence-transformers pulls in torch, which is a large download. The
        # CPU-only wheel index keeps it to a fraction of the CUDA build, and
        # the tests never touch a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # There is no frontend test runner yet, but a build catches broken
      # imports and syntax errors before they reach the browser.
      - name: Build
        working-directory: frontend
        run: npm run build
